<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 800 620"
   role="img"
   aria-label="Diagram of the main CUDA dynamics in the cuda-cubemap application: the host loads the image, allocates device memory, uploads it (H2D), asynchronously launches the kernel, blocks on cudaDeviceSynchronize, downloads the result (D2H), and saves it, while the device runs one thread per output pixel against global memory holding d_input and d_output."
   version="1.1"
   id="svg108"
   sodipodi:docname="CudaCubemapDynamics_Scheme.svg"
   width="800"
   height="620"
   inkscape:version="1.4.4 (dcaf3e7, 2026-05-05)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
